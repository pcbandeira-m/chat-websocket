<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Chat em tempo real com WebSocket">
    <title>Chat - Conexões Instantâneas</title>
    <link rel="stylesheet" href="/src/styles.css">
</head>

<body class="bg-canvas h-screen flex flex-col">
    <div id="app" class="flex flex-col flex-1 min-h-0">
        <!-- Header -->
        <header class="bg-surface border-b border-primary/30 shadow-sm">
            <div class="max-w-6xl mx-auto px-4 py-4 flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-lg bg-primary/20 flex items-center justify-center">
                        <span class="text-2xl">💬</span>
                    </div>
                    <h1 class="text-2xl font-bold text-dark">Nem te conto... 👀</h1>
                </div>
                <div id="user-status" class="flex items-center gap-2 text-dark/80 text-sm">
                    <span class="inline-block w-2 h-2 bg-primary rounded-full animate-pulse"></span>
                    <span>Conectado</span>
                </div>
            </div>
        </header>

        <!-- Main Content -->
        <main class="flex-1 min-h-0 flex max-w-6xl w-full mx-auto p-4 overflow-hidden">
            <!-- Chat Area -->
            <section class="flex-1 flex flex-col bg-surface rounded-2xl shadow-lg border border-primary/30 overflow-hidden">
                <div class="p-4 border-b border-primary/30">
                    <label for="name-input" class="block text-sm font-medium text-dark mb-1">Seu nome</label>
                    <input id="name-input" type="text" maxlength="50" autocomplete="nickname" placeholder="Como quer ser chamado?" aria-describedby="name-error" class="w-full sm:max-w-xs px-4 py-2 bg-white text-dark rounded-lg focus:outline-none focus:ring-2 focus:ring-primary placeholder-dark/60">
                    <p id="name-error" role="alert" class="hidden mt-1 text-sm text-red-700">Digite seu nome para enviar mensagens.</p>
                </div>
                <!-- Messages Container -->
                <div id="messages-container" class="flex-1 overflow-y-auto p-6 space-y-4 scroll-smooth">
                    <div id="welcome-message" class="flex justify-center items-center h-full text-dark/70">
                        <div class="text-center">
                            <p class="text-lg mb-2">👋 Bem-vindo ao Nem te conto... 👀</p>
                            <p class="text-sm">Digite uma mensagem para começar</p>
                        </div>
                    </div>
                </div>

                <!-- Input Area -->
                <div class="p-4 border-t border-primary/30 bg-surface">
                    <div class="flex gap-3">
                        <input id="message-input" type="text" placeholder="Digite sua mensagem..." class="flex-1 px-4 py-3 bg-white text-dark rounded-lg focus:outline-none focus:ring-2 focus:ring-primary transition-all placeholder-dark/60">
                        <button id="send-btn" class="px-6 py-3 bg-primary hover:bg-primary/80 text-dark rounded-lg font-medium transition-all transform hover:scale-105 active:scale-95">
                            Enviar
                        </button>
                    </div>
                </div>
            </section>
        </main>

        <!-- Footer -->
        <footer class="bg-surface border-t border-primary/30">
            <div class="max-w-6xl mx-auto px-4 py-4 flex items-center justify-between text-sm">
                <div class="text-dark/70">
                    <p>© 2026 Nem te conto... 👀 — Conexões em tempo real</p>
                </div>
                <div class="flex gap-6 text-dark/70">
                    <a href="#" class="hover:text-dark transition-colors">Privacidade</a>
                    <a href="#" class="hover:text-dark transition-colors">Termos</a>
                    <a href="#" class="hover:text-dark transition-colors">Contato</a>
                </div>
            </div>
        </footer>
    </div>

    <script type="module" src="/src/main.ts"></script>
</body>

</html>
