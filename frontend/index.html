<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Chat em tempo real com WebSocket">
    <title>Chat - Conexões Instantâneas</title>
    <link rel="stylesheet" href="/src/styles.css">
</head>

<body class="bg-dark min-h-screen flex flex-col">
    <div id="app" class="flex flex-col flex-1">
        <!-- Header -->
        <header class="bg-dark border-b border-primary/50 shadow-lg">
            <div class="max-w-6xl mx-auto px-4 py-4 flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-lg bg-primary/20 flex items-center justify-center">
                        <span class="text-2xl">💬</span>
                    </div>
                    <h1 class="text-2xl font-bold text-primary">Fofoca? ☕</h1>
                </div>
                <div id="user-status" class="flex items-center gap-2 text-primary/80 text-sm">
                    <span class="inline-block w-2 h-2 bg-primary rounded-full animate-pulse"></span>
                    <span>Conectado</span>
                </div>
            </div>
        </header>

        <!-- Main Content -->
        <main class="flex-1 flex max-w-6xl w-full mx-auto gap-6 p-4 overflow-hidden">
            <!-- Sidebar - Conversations -->
            <aside class="w-80 bg-dark/80 backdrop-blur-sm rounded-2xl shadow-lg flex flex-col border border-primary/30">
                <div class="p-4 border-b border-primary/30">
                    <div class="flex gap-2">
                        <input id="new-chat-input" type="text" placeholder="Nova conversa..." class="flex-1 px-3 py-2 bg-dark text-primary rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-primary placeholder-primary/50">
                        <button id="new-chat-btn" class="px-3 py-2 bg-primary hover:bg-primary/80 text-dark rounded-lg transition-colors font-semibold">
                            +
                        </button>
                    </div>
                </div>

                <!-- Conversations List -->
                <div id="conversations" class="flex-1 overflow-y-auto space-y-2 p-3">
                    <div class="p-3 rounded-lg bg-primary/20 border border-primary/50 cursor-pointer hover:bg-primary/30 transition-colors">
                        <div class="font-medium text-primary text-sm">Geral</div>
                        <div class="text-xs text-primary/60 mt-1">Última mensagem aqui...</div>
                    </div>
                </div>
            </aside>

            <!-- Chat Area -->
            <section class="flex-1 flex flex-col bg-dark/80 backdrop-blur-sm rounded-2xl shadow-lg border border-primary/30 overflow-hidden">
                <!-- Messages Container -->
                <div id="messages-container" class="flex-1 overflow-y-auto p-6 space-y-4 scroll-smooth">
                    <div class="flex justify-center items-center h-full text-primary/50">
                        <div class="text-center">
                            <p class="text-lg mb-2">👋 Bem-vindo ao Fofoca? ☕</p>
                            <p class="text-sm">Comece uma nova conversa ou selecione uma existente</p>
                        </div>
                    </div>
                </div>

                <!-- Input Area -->
                <div class="p-4 border-t border-primary/30 bg-dark">
                    <div class="flex gap-3">
                        <input id="message-input" type="text" placeholder="Digite sua mensagem..." class="flex-1 px-4 py-3 bg-dark/60 text-primary rounded-lg focus:outline-none focus:ring-2 focus:ring-primary transition-all placeholder-primary/40">
                        <button id="send-btn" class="px-6 py-3 bg-primary hover:bg-primary/80 text-dark rounded-lg font-medium transition-all transform hover:scale-105 active:scale-95">
                            Enviar
                        </button>
                    </div>
                </div>
            </section>
        </main>

        <!-- Footer -->
        <footer class="bg-dark border-t border-primary/30">
            <div class="max-w-6xl mx-auto px-4 py-4 flex items-center justify-between text-sm">
                <div class="text-primary/70">
                    <p>© 2024 Fofoca? ☕ — Conexões em tempo real</p>
                </div>
                <div class="flex gap-6 text-primary/70">
                    <a href="#" class="hover:text-primary transition-colors">Privacidade</a>
                    <a href="#" class="hover:text-primary transition-colors">Termos</a>
                    <a href="#" class="hover:text-primary transition-colors">Contato</a>
                </div>
            </div>
        </footer>
    </div>

    <script type="module" src="/src/main.ts"></script>
</body>

</html>
